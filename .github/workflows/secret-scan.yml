# Secret scan: this repository is public, so nothing secret may ever go into it.
#
# On every push and pull request this runs gitleaks over the new commits (and
# over the whole history when run by hand, or weekly). If it finds anything that
# looks like a key, token or password, the run fails and GitHub emails the owner.
# Findings are redacted in the log, so a failed run never prints the secret.
#
# If it ever fails: treat the key as leaked. Revoke or rotate it at its source
# first (deleting the commit is not enough, because forks and caches keep it),
# then remove it from the code.
#
# The Supabase publishable key in src/onlineConfig.ts is public by design and
# is not reported.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Mondays, full history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned and checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          if [ -n "$range" ]; then
            echo "Scanning new commits: $range"
            ./gitleaks git --redact --no-banner -v --exit-code 1 --log-opts="$range" .
          else
            echo "Scanning the whole history"
            ./gitleaks git --redact --no-banner -v --exit-code 1 --log-opts="--all" .
          fi
