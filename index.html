<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The game used to live at phishguard-by-faith.netlify.app. Send visitors
      // from that old address to the new one, keeping the path.
      if (location.hostname === 'phishguard-by-faith.netlify.app') {
        location.replace('https://thespaceio.github.io/LureLens' + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LureLens by Th3 SpaceIO: a timed phishing-detection training game with Nigerian scenarios, three levels and a scoreboard." />
    <meta name="theme-color" content="#1B1035" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LureLens" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- Link previews (LinkedIn, WhatsApp, X, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LureLens" />
    <meta property="og:title" content="LureLens: see the lure before it hooks you" />
    <meta property="og:description" content="A free phishing awareness game by Th3 SpaceIO, built around the scams that land in Nigerian inboxes. Three levels, against the clock." />
    <meta property="og:url" content="https://thespaceio.github.io/LureLens/" />
    <meta property="og:image" content="https://thespaceio.github.io/LureLens/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The LureLens logo with the line: See the lure before it hooks you." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://thespaceio.github.io/LureLens/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>LureLens | Th3 SpaceIO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the offline service worker in production builds only.
      if ('serviceWorker' in navigator && !/localhost:5173/.test(location.host)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
