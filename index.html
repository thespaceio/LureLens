<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LureLens by Th3 SpaceIO: a timed phishing-detection training game with Nigerian scenarios, three levels and a scoreboard." />
    <meta name="theme-color" content="#0A1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LureLens" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="96x96" href="./icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192x192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>LureLens | Th3 SpaceIO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the offline service worker in production builds only.
      if ('serviceWorker' in navigator && !/localhost:5173/.test(location.host)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
